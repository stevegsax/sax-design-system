<ul class="section-nav">
  <li class="current"><a href="#profile">Profile</a></li>

<!-- slot:main -->
<h1>Settings</h1>
<form id="settings-form">
  <section class="settings-section" id="profile">
    <h2>Profile</h2>
    <div class="field">
      <label for="display-name">Display name</label>
      <input id="display-name" type="text" value="M. Okafor">
    </div>
    <div class="field">
      <label for="email">Work email</label>
      <input id="email" type="email" value="m.okafor@saxcapital.co">
    </div>
  </section>
  <section class="settings-section" id="retention">
    <h2>Retention</h2>
    <div class="field">
      <label for="retention-window">Snapshot retention</label>
      <select id="retention-window">
        <option>7 years (compliance default)</option>
        <option>10 years</option>
        <option>Indefinite</option>
      </select>
    </div>
    <div class="field">
      <label for="archive-tag">Archive tag</label>
      <input id="archive-tag" type="text" value="read-only" disabled>
    </div>
  </section>
</form>
