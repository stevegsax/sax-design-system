<!--
pattern: page-shell-application
since: v1.1.0
adr: decisions/2026-07-28-page-shell-application.md
usage: Every application page starts here. Regions: app bar (brand + toolbar), sidebar, full-bleed main, status footer. The slot markers (slot:name) are the prototype build's assembly anchors — keep them when copying.
-->
<style>
  .page-shell { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }

  .app-bar {
    background: var(--color-background-surface);
    border-block-end: var(--border-width-default) solid var(--color-border-default);
  }
  .app-bar-row {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-sm) var(--container-gutter);
  }
  .brand {
    font: var(--typography-heading-3);
    color: var(--color-text-heading);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
  }
  .brand img { height: var(--space-lg); }
  .toolbar { display: flex; gap: var(--space-sm); align-items: center; flex: 1; justify-content: end; }

  .app { display: grid; grid-template-columns: var(--shell-sidebar-width) 1fr; min-height: 0; }

  .sidebar {
    background: var(--color-background-surface);
    border-inline-end: var(--border-width-default) solid var(--color-border-default);
    padding: var(--space-md);
    overflow-y: auto;
  }
  .sidebar h2 {
    font: var(--typography-label);
    color: var(--color-text-muted);
    text-transform: uppercase;
    margin-block-end: var(--space-sm);
  }
  .sidebar .section-nav { list-style: none; padding: 0; margin: 0; }
  .sidebar .section-nav a {
    display: block;
    text-decoration: none;
    font: var(--typography-label);
    color: var(--color-text-body);
    padding: var(--space-2xs) var(--space-xs);
    border-radius: var(--radius-sm);
  }
  .sidebar .section-nav .current a { background: var(--color-accent-subtle); color: var(--color-text-link); }

  .app > main { max-width: none; margin: 0; padding: var(--space-lg); }

  .app-footer {
    border-block-start: var(--border-width-default) solid var(--color-border-default);
    padding: var(--space-xs) var(--container-gutter);
    display: flex;
    justify-content: space-between;
  }
  .app-footer p { font: var(--typography-caption); color: var(--color-text-muted); margin: 0; }
</style>
<div class="page-shell">

  <!-- region: app bar —
       The persistent chrome strip. Identity on the left (symbol logo +
       product name, one <a class="brand">), global actions on the right in
       the <nav class="toolbar">: search, then at most one primary action
       (button pattern, .btn.primary); everything else renders as base.css
       secondary buttons. Surface background + bottom border come from
       semantic roles; the bar never scrolls away. Extend by adding nav
       links between brand and toolbar — do not add a second primary. -->
  <header class="app-bar">
    <div class="app-bar-row">
      <a class="brand" href="#"><img src="../static-assets/logos/symbol-only/SAX_logo_symbol.svg" alt=""><!-- slot:brand -->Document Workspace<!-- /slot:brand --></a>
      <nav class="toolbar" aria-label="Global actions">
        <!-- slot:toolbar -->
        <input type="search" placeholder="Search documents" aria-label="Search documents">
        <button type="button">Export</button>
        <!-- /slot:toolbar -->
      </nav>
    </div>
  </header>

  <!-- region: app body —
       A two-column grid: sidebar at --shell-sidebar-width (the one shell
       token — situations and products tune density here), content takes
       the rest. A page with no sidebar drops the <aside> and this <div>,
       keeping <main> directly under the shell. -->
  <div class="app">

    <!-- region: sidebar —
         Contextual navigation or supporting objects for the current
         screen: section nav, filters, annotations. Its own scroll;
         surface background + end border separate it from content. Group
         content under uppercase <h2> labels (typography.label on muted);
         section navigation is a <ul class="section-nav"> with .current on
         the active item. Extend with cards (card pattern) or nav lists —
         never primary actions; those belong in the app bar or content
         header. -->
    <aside class="sidebar">
      <!-- slot:sidebar -->
      <h2>Sections</h2>
      <ul class="section-nav">
        <li class="current"><a href="#">Overview</a></li>
        <li><a href="#">Details</a></li>
      </ul>
      <!-- /slot:sidebar -->
    </aside>

    <!-- region: main —
         The working surface. Full-bleed (application unbounds
         --container-max by token); own padding from the spacing scale.
         Starts with one <h1>; compose from patterns — field for forms,
         card for groupings, tag for metadata, alert for transient status.
         Tables are base-styled; add page-specific classes for behavior,
         not for colors or type. -->
    <main>
      <!-- slot:main -->
      <h1>Page title</h1>
      <p>Content composed from the pattern library and semantic tokens.</p>
      <!-- /slot:main -->
    </main>
  </div>

  <!-- region: footer —
       Thin status strip: ownership and quiet metadata in caption type.
       Not navigation, not actions. Omit only on embedded/frameless
       surfaces. -->
  <footer class="app-footer">
    <!-- slot:footer -->
    <p>© 2026 SAX Capital. All rights reserved.</p>
    <p>Internal use only.</p>
    <!-- /slot:footer -->
  </footer>
</div>
