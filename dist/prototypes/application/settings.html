<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Document Workspace — SAX prototype</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../base.css">
<style>
  .page-shell { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }

  .app-bar {
    background: var(--color-background-surface);
    border-block-end: var(--border-width-default) solid var(--color-border-default);
  }
  .app-bar-row {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-sm) var(--container-gutter);
  }
  .brand {
    font: var(--typography-heading-3);
    color: var(--color-text-heading);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
  }
  .brand img { height: var(--space-lg); }
  .toolbar { display: flex; gap: var(--space-sm); align-items: center; flex: 1; justify-content: end; }

  .app { display: grid; grid-template-columns: var(--shell-sidebar-width) 1fr; min-height: 0; }

  .sidebar {
    background: var(--color-background-surface);
    border-inline-end: var(--border-width-default) solid var(--color-border-default);
    padding: var(--space-md);
    overflow-y: auto;
  }
  .sidebar h2 {
    font: var(--typography-label);
    color: var(--color-text-muted);
    text-transform: uppercase;
    margin-block-end: var(--space-sm);
  }
  .sidebar .section-nav { list-style: none; padding: 0; margin: 0; }
  .sidebar .section-nav a {
    display: block;
    text-decoration: none;
    font: var(--typography-label);
    color: var(--color-text-body);
    padding: var(--space-2xs) var(--space-xs);
    border-radius: var(--radius-sm);
  }
  .sidebar .section-nav .current a { background: var(--color-accent-subtle); color: var(--color-text-link); }

  .app > main { max-width: none; margin: 0; padding: var(--space-lg); }

  .app-footer {
    border-block-start: var(--border-width-default) solid var(--color-border-default);
    padding: var(--space-xs) var(--container-gutter);
    display: flex;
    justify-content: space-between;
  }
  .app-footer p { font: var(--typography-caption); color: var(--color-text-muted); margin: 0; }


  .btn {
    font: var(--button-label-font);
    border-radius: var(--button-radius);
    padding: var(--button-padding-block) var(--button-padding-inline);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn.primary {
    background: var(--button-primary-background);
    color: var(--button-primary-text);
    border: none;
  }
  .btn.primary:hover { background: var(--button-primary-background-hover); }
  .btn.primary:active { background: var(--button-primary-background-active); }
  .btn.secondary {
    background: var(--button-secondary-background);
    color: var(--button-secondary-text);
    border: var(--border-width-default) solid var(--button-secondary-border);
  }
  .btn:disabled {
    background: var(--button-disabled-background);
    color: var(--button-disabled-text);
    cursor: default;
  }


  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-2xs);
    margin-block-end: var(--rhythm-flow);
  }


  .card {
    background: var(--card-background);
    border: var(--border-width-default) solid var(--card-border);
    border-radius: var(--card-radius);
    padding: var(--card-padding);
  }
  .card > :last-child { margin-block-end: 0; }


  .settings-section { max-width: 36rem; margin-block-end: var(--rhythm-section); }
  .settings-section h2 { font: var(--typography-heading-3); color: var(--color-text-heading);
                         margin-block-end: var(--space-md); }
</style>
</head>
<body data-situation="application">
<div class="page-shell">

  <!-- region: app bar —
       The persistent chrome strip. Identity on the left (symbol logo +
       product name, one <a class="brand">), global actions on the right in
       the <nav class="toolbar">: search, then at most one primary action
       (button pattern, .btn.primary); everything else renders as base.css
       secondary buttons. Surface background + bottom border come from
       semantic roles; the bar never scrolls away. Extend by adding nav
       links between brand and toolbar — do not add a second primary. -->
  <header class="app-bar">
    <div class="app-bar-row">
      <a class="brand" href="#"><img src="../../sax-logo-symbol.svg" alt="">Document Workspace</a>
      <nav class="toolbar" aria-label="Global actions">
        <button class="btn primary" type="submit" form="settings-form">Save changes</button>
      </nav>
    </div>
  </header>

  <!-- region: app body —
       A two-column grid: sidebar at --shell-sidebar-width (the one shell
       token — situations and products tune density here), content takes
       the rest. A page with no sidebar drops the <aside> and this <div>,
       keeping <main> directly under the shell. -->
  <div class="app">

    <!-- region: sidebar —
         Contextual navigation or supporting objects for the current
         screen: section nav, filters, annotations. Its own scroll;
         surface background + end border separate it from content. Group
         content under uppercase <h2> labels (typography.label on muted);
         section navigation is a <ul class="section-nav"> with .current on
         the active item. Extend with cards (card pattern) or nav lists —
         never primary actions; those belong in the app bar or content
         header. -->
    <aside class="sidebar">
      <h2>Settings</h2>
<ul class="section-nav">
  <li class="current"><a href="#profile">Profile</a></li>
  <li><a href="#retention">Retention</a></li>
  <li><a href="#notifications">Notifications</a></li>
  <li><a href="#access">Access</a></li>
</ul>
    </aside>

    <!-- region: main —
         The working surface. Full-bleed (application unbounds
         --container-max by token); own padding from the spacing scale.
         Starts with one <h1>; compose from patterns — field for forms,
         card for groupings, tag for metadata, alert for transient status.
         Tables are base-styled; add page-specific classes for behavior,
         not for colors or type. -->
    <main>
      <h1>Settings</h1>
<form id="settings-form">
  <section class="settings-section" id="profile">
    <h2>Profile</h2>
    <div class="field">
      <label for="display-name">Display name</label>
      <input id="display-name" type="text" value="M. Okafor">
    </div>
    <div class="field">
      <label for="email">Work email</label>
      <input id="email" type="email" value="m.okafor@saxcapital.co">
    </div>
  </section>
  <section class="settings-section" id="retention">
    <h2>Retention</h2>
    <div class="field">
      <label for="retention-window">Snapshot retention</label>
      <select id="retention-window">
        <option>7 years (compliance default)</option>
        <option>10 years</option>
        <option>Indefinite</option>
      </select>
    </div>
    <div class="field">
      <label for="archive-tag">Archive tag</label>
      <input id="archive-tag" type="text" value="read-only" disabled>
    </div>
  </section>
</form>
    </main>
  </div>

  <!-- region: footer —
       Thin status strip: ownership and quiet metadata in caption type.
       Not navigation, not actions. Omit only on embedded/frameless
       surfaces. -->
  <footer class="app-footer">
    <p>© 2026 SAX Capital. All rights reserved.</p>
<p>Changes are audited.</p>
  </footer>
</div>

</body>
</html>
